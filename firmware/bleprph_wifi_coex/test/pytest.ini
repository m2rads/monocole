[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Tests must share the fixtures' loop: the session-scoped BleakClient creates
# futures on it, and awaiting those from a per-function loop raises
# "got Future attached to a different loop".
asyncio_default_test_loop_scope = session
testpaths = .
addopts = -v --strict-markers

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# All tests live in tests/ but are compiled as in-crate modules (see the
# #[path] declarations at the bottom of each src/*.rs file), giving them
# access to private items. autotests is off so Cargo doesn't also try to
# build tests/*.rs as standalone integration crates.
autotests = false

[lib]
name = "app_lib"
doctest = false

# The binary is a thin shim around app_lib::run(); no tests of its own.
[[bin]]
name = "app"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
btleplug = "0.11"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
